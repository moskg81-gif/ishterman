<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-visual" />
    <title>Иштерман</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#DAEEFF" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #e8e8e8;
        min-height: 100vh;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 20px 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      /* Класс app-shell включается только для мобильного приложения (не для /admin) —
         фиксирует высоту под видимую область экрана, чтобы страница не скроллилась
         целиком и нижняя панель вкладок не уезжала за экран. Админка использует
         обычную прокрутку body, ей этот класс не нужен. */
      html.app-shell, body.app-shell {
        height: 100%;
        overflow: hidden;
      }
      body.app-shell {
        height: 100vh;
        height: 100dvh;
        min-height: 0;
      }
      #root { width: 100%; }
      body.app-shell #root { height: 100%; }
      @media (max-width: 480px) {
        body { padding: 0; background: #000; align-items: stretch; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
